[project]
name = "mjlab-franka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "smanni-rai", email = "smanni@rai-inst.com" }
]
requires-python = ">=3.11, <3.13"
dependencies = [
    "hydra-core>=1.3.2",
    "mjlab==1.3.0",
    "omegaconf>=2.3.0",
    "scipy>=1.17.1",
    "skrl>=1.4.3",
    "tqdm>=4.67.3",
    "wandb>=0.27.0",
    "warp-lang>=1.12,<1.13",
]

[project.scripts]
mjlab-franka = "mjlab_franka:main"
train = "mjlab_franka.train:main"
play = "mjlab_franka.play:main"
play-interactive = "mjlab_franka.play_interactive:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
cu128 = ["torch>=2.7.0,<2.10"]
cpu = ["torch>=2.7.0,<2.10"]

# Mirror mjlab's torch routing so the `cu128` group pulls a cu128 torch wheel
# (without this, uv resolves the latest torch from PyPI which segfaults inside
# torch.jit.script when importing mjlab.entity).
[tool.uv]
conflicts = [
    [{ group = "cu128" }, { group = "cpu" }],
]
default-groups = ["dev", "cu128"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", group = "cu128", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cpu", group = "cpu", marker = "sys_platform != 'darwin'" },
]
